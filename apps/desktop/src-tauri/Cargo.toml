[package]
name = "nova"
version = "0.1.0"
description = "NOVA desktop shell: tray, launcher and backend supervisor"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
getrandom = "0.3"
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
